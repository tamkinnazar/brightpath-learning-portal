{% extends "base.html" %}

{% block content %}
<h1>Assignments</h1>

{% for assignment in assignments %}
<div class="card">
    <h2>{{ assignment.title }}</h2>
    <p><strong>Course:</strong> {{ assignment.course_title }}</p>
    <p>{{ assignment.description }}</p>
</div>
{% endfor %}
{% endblock %}
