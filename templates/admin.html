{% extends "base.html" %}

{% block content %}
<h1>Admin Panel</h1>
<p>Only administrators can view this page.</p>

<table>
    <tr>
        <th>User ID</th>
        <th>Username</th>
        <th>Role</th>
    </tr>
    {% for user in users %}
    <tr>
        <td>{{ user.id }}</td>
        <td>{{ user.username }}</td>
        <td>{{ user.role }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
