{% extends "base.html" %}

{% block content %}
<div class="progress-container" style="max-width: 800px; margin: 0 auto; padding: 20px;">
    <div class="logo-header" style="text-align: center; margin-bottom: 20px;">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="BrightPath Academy Logo" width="120">
    </div>

    <h1>Academic Progress</h1>
    <p>Performance review tracker for: <strong>{{ user }}</strong></p>
    
    <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

    <div class="card progress-card" style="background: #f9f9f9; padding: 30px; border-radius: 8px; border: 1px solid #ddd; text-align: center;">
        <h3>Overall Course Completion</h3>
        
        <div class="progress-bar-bg" style="background: #e9ecef; border-radius: 25px; width: 100%; height: 30px; margin: 20px 0; overflow: hidden; border: 1px solid #ccc;">
            <div class="progress-bar-fill" style="background: #28a745; width: {{ progress }}%; height: 100%; line-height: 30px; color: white; font-weight: bold; text-align: center;">
                {{ progress }}%
            </div>
        </div>

        <p style="font-size: 16px; color: #333;">
            Incredible work! You have cleared <strong>{{ completed }}</strong> out of <strong>{{ total }}</strong> assignments.
        </p>
    </div>

    <div style="text-align: center; margin-top: 30px;">
        <a href="/dashboard" style="display: inline-block; padding: 10px 20px; background-color: #007bff; color: white; text-decoration: none; border-radius: 4px; font-weight: bold;">
            ← Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
