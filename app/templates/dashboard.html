<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="navbar">
    <h2>BrightPath Academy</h2>
    <div>
        <span style="color:white; margin-right:10px;">{{ user }}</span>
        <a class="button" href="/logout">Logout</a>
    </div>
</div>

<div class="container">

    <div class="card profile-card" style="display: flex; align-items: center; gap: 20px; margin-bottom: 20px;">
        <img src="{{ photo if photo else url_for('static', filename='logo.png') }}" 
             class="profile-img" 
             alt="profile" 
             style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 2px solid #ccc;">

        <div>
            <h2>Welcome back, {{ user }}</h2>
            <p>BrightPath Student Dashboard</p>

            <form action="/upload-profile" method="POST" enctype="multipart/form-data" style="margin-top:10px;">
                <input type="file" name="profile_pic" required>
                <button type="submit">Upload Profile Picture</button>
            </form>
        </div>
    </div>

    <div class="stats-grid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px;">
        <a href="/courses" class="stat-btn" style="text-align: center; padding: 15px; background: #f4f4f4; border-radius: 8px; text-decoration: none; color: #333; font-weight: bold;">
            Courses
        </a>
        <a href="/assignments" class="stat-btn" style="text-align: center; padding: 15px; background: #f4f4f4; border-radius: 8px; text-decoration: none; color: #333; font-weight: bold;">
            Assignments
        </a>
        <a href="/progress" class="stat-btn" style="text-align: center; padding: 15px; background: #f4f4f4; border-radius: 8px; text-decoration: none; color: #333; font-weight: bold;">
            Progress
        </a>
    </div>

    <div class="card">
        <h3>Quick Actions</h3>
        <a class="button" href="/courses">View Courses</a>
        <a class="button" href="/assignments">View Assignments</a>
    </div>

</div>

</body>
</html>
